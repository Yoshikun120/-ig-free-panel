<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG FREE • ปั๊มไลก์ฟรี</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b0b12;color:#fff;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:24px 16px}.brand{font-size:28px;font-weight:800;margin:24px 0 8px}.sub{color:#a9a9b5;margin-bottom:22px}.card{background:#15151f;border:1px solid #282837;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0005}label{display:block;margin:14px 0 7px;color:#ddd;font-size:14px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #343447;background:#0e0e17;color:#fff;font-size:15px;outline:none}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff2d75,#7c4dff);color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.notice{margin-top:16px;padding:13px;border-radius:12px;background:#10101a;color:#bdbdcc;font-size:13px;line-height:1.5}.status{margin-top:16px;display:none;padding:14px;border-radius:12px;background:#0e1720;border:1px solid #23394b}.ok{color:#75e6a8}.err{color:#ff7d8f}.small{font-size:12px;color:#8e8e9d;margin-top:12px;text-align:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#24243a;color:#c8c8ff;font-size:11px}
</style></head>
<body><main class="wrap"><div class="brand">IG FREE 🚀</div><div class="sub">เพิ่มไลก์ Instagram แบบฟรี ไม่ต้องกรอกรหัสผ่าน</div>
<div class="card"><span class="badge">FREE SERVICE</span><label>ลิงก์โพสต์ / Reel Instagram</label><input id="link" placeholder="https://www.instagram.com/p/..." autocomplete="off"><button id="submit">เริ่มปั๊มฟรี</button><div class="notice">• ระบบจะค้นหาบริการ Instagram Likes จาก AUTO-TH อัตโนมัติ<br>• ผู้ใช้ไม่ต้องกรอกรหัสผ่าน Instagram<br>• ปุ่มนี้ส่งคำสั่งผ่านเซิร์ฟเวอร์ของเว็บ</div><div id="status" class="status"></div></div><div class="small">ระบบตัวอย่างสำหรับบริการที่ได้รับอนุญาตจากผู้ให้บริการ API</div></main>
<script>
const status=document.querySelector('#status'), btn=document.querySelector('#submit');
function show(msg,ok=false){status.style.display='block';status.className='status '+(ok?'ok':'err');status.innerHTML=msg}
btn.onclick=async()=>{const link=document.querySelector('#link').value.trim();if(!/^https?:\/\/(www\.)?instagram\.com\//i.test(link))return show('กรุณาใส่ลิงก์ Instagram ที่ถูกต้อง');btn.disabled=true;show('กำลังค้นหาบริการและส่งคำสั่ง...');try{let r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link})});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'สั่งซื้อไม่สำเร็จ');show(`สำเร็จ 🎉<br>บริการ: ${j.service}<br>จำนวน: ${j.quantity}<br>หมายเลขคำสั่งซื้อ: <b>${j.order}</b>`,true)}catch(e){show(e.message)}finally{btn.disabled=false}};
</script></body></html>
